<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes and Ladders Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');

        body { 
            margin: 0; overflow: hidden; background-color: #0f172a; 
            font-family: 'Nunito', sans-serif; user-select: none;
            display: flex; flex-direction: row; height: 100vh;
        }

        /* --- LAYOUT --- */
        #game-area {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, #1e293b 0%, #020617 100%);
            padding: 20px; box-sizing: border-box;
        }

        #sidebar {
            width: 350px; background: #1e293b; border-left: 4px solid #334155;
            display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* --- SIDEBAR UI --- */
        .sidebar-header {
            background: #0f172a; padding: 20px; text-align: center;
            border-bottom: 4px solid #334155;
        }
        .sidebar-header h1 {
            font-family: 'Fredoka One', cursive; font-size: 36px; color: #facc15;
            margin: 0; text-shadow: 0 4px 0 #ca8a04; letter-spacing: 1px;
        }

        .players-container {
            padding: 20px; display: flex; flex-direction: column; gap: 15px; flex: 1;
            overflow-y: auto;
        }

        .player-card {
            background: #334155; border-radius: 12px; padding: 15px;
            display: flex; align-items: center; justify-content: space-between;
            border: 3px solid transparent; transition: 0.3s; opacity: 0.5;
        }
        .player-card.active {
            opacity: 1; border-color: #f8fafc; transform: scale(1.05);
            background: #475569; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .p-info { display: flex; align-items: center; gap: 15px; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.8); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); }
        .player-name { font-family: 'Fredoka One'; font-size: 20px; color: white; }
        .player-pos { font-size: 24px; font-weight: 900; color: #cbd5e1; background: #1e293b; padding: 5px 15px; border-radius: 8px;}

        .controls-area {
            background: #0f172a; padding: 30px 20px; border-top: 4px solid #334155;
            display: flex; flex-direction: column; align-items: center;
        }

        #dice {
            width: 90px; height: 90px; background: white; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 50px; font-weight: bold; color: #0f172a; font-family: 'Fredoka One';
            box-shadow: 0 10px 0 #cbd5e1, 0 15px 20px rgba(0,0,0,0.5);
            cursor: pointer; transition: 0.1s; margin-bottom: 20px;
        }
        #dice:active { transform: translateY(10px); box-shadow: 0 0 0 #cbd5e1, 0 5px 10px rgba(0,0,0,0.5); }
        #dice.rolling { animation: shake 0.4s infinite; pointer-events: none; }
        #dice.disabled { opacity: 0.5; pointer-events: none; cursor: not-allowed; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-5deg); }
            20% { transform: translate(-3px, 0px) rotate(5deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(5deg); }
            50% { transform: translate(-1px, 2px) rotate(-5deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-5deg); }
            80% { transform: translate(-1px, -1px) rotate(5deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-5deg); }
        }

        #log-text { color: #facc15; font-size: 18px; text-align: center; height: 50px; font-weight: 900;}

        /* --- BOARD CANVAS --- */
        canvas {
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); border-radius: 12px;
            background: white; max-width: 95vmin; max-height: 95vmin;
        }

        /* --- MODALS --- */
        .modal {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;
            z-index: 100; backdrop-filter: blur(5px);
        }
        .modal-box {
            background: #1e293b; padding: 40px 60px; border-radius: 24px; text-align: center;
            border: 6px solid #facc15; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .btn-action {
            background: #3b82f6; color: white; border: none; padding: 15px 40px; font-size: 24px;
            font-family: 'Fredoka One'; border-radius: 12px; cursor: pointer; transition: 0.1s;
            box-shadow: 0 6px 0 #1d4ed8; margin-top: 20px;
        }
        .btn-action:active { transform: translateY(6px); box-shadow: 0 0 0 #1d4ed8; }

        @media (max-width: 800px) {
            body { flex-direction: column; }
            #game-area { padding: 10px; }
            #sidebar { width: 100%; border-left: none; border-top: 4px solid #334155; flex-direction: row; height: 120px; padding: 0;}
            .sidebar-header { display: none; }
            .players-container { flex-direction: row; padding: 10px; gap: 10px; overflow-x: auto; overflow-y: hidden; align-items: center;}
            .player-card { padding: 10px; min-width: 140px; }
            .player-name { font-size: 14px; }
            .player-pos { font-size: 16px; padding: 2px 8px;}
            .controls-area { padding: 10px; border-top: none; border-left: 4px solid #334155; flex-direction: row; gap: 20px;}
            #dice { width: 70px; height: 70px; font-size: 36px; margin-bottom: 0; box-shadow: 0 6px 0 #cbd5e1;}
            #dice:active { transform: translateY(6px); box-shadow: 0 0 0 #cbd5e1; }
            #log-text { font-size: 14px; width: 100px; height: auto;}
        }
    </style>
</head>
<body>

    <!-- START MODAL -->
    <div class="modal" id="start-modal">
        <div class="modal-box">
            <h1 style="font-family: 'Fredoka One'; font-size: 64px; color: white; margin: 0 0 10px 0; text-shadow: 0 6px 0 #000;">SNAKES <span style="color:#ef4444">&</span> LADDERS</h1>
            <p style="color: #cbd5e1; font-size: 20px; margin-bottom: 30px;">First player to reach exactly 100 wins!<br>Watch out for the slithery snakes!</p>
            <button class="btn-action" style="background: #facc15; color: #1e293b; box-shadow: 0 6px 0 #ca8a04;" onclick="startGame()">PLAY GAME</button>
        </div>
    </div>

    <!-- WIN MODAL -->
    <div class="modal" id="win-modal" style="display: none;">
        <div class="modal-box">
            <h1 id="win-title" style="font-family: 'Fredoka One'; font-size: 64px; color: white; margin: 0 0 10px 0; text-shadow: 0 6px 0 #000;">RED WINS!</h1>
            <button class="btn-action" onclick="location.reload()">PLAY AGAIN</button>
        </div>
    </div>

    <!-- GAME BOARD -->
    <div id="game-area">
        <canvas id="board-canvas"></canvas>
    </div>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>SNAKES & LADDERS</h1>
        </div>
        
        <div class="players-container" id="players-list">
            <!-- Injected by JS -->
        </div>

        <div class="controls-area">
            <div id="dice" onclick="rollDice()">🎲</div>
            <div id="log-text">Click the dice to start!</div>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if(!audioCtx) audioCtx = new AudioContext(); }
        
        function playSound(type) {
            if(!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            
            if(type === 'roll') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(800, t+0.1);
                gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.2);
            } else if(type === 'hop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(800, t+0.1);
                gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.1);
            } else if(type === 'snake') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(50, t+0.6);
                gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.6);
            } else if(type === 'ladder') {
                osc.type = 'square'; osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(900, t+0.5);
                gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.5);
            } else if(type === 'win') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, t); osc.frequency.setValueAtTime(600, t+0.2); osc.frequency.setValueAtTime(800, t+0.4);
                gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.8);
            }
            
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + 1);
        }

        // --- CONSTANTS & DATA ---
        const canvas = document.getElementById('board-canvas');
        const ctx = canvas.getContext('2d');
        let size, ts; // size = canvas dimension, ts = tile size

        const COLORS = {
            p1: '#ef4444', p2: '#3b82f6', p3: '#22c55e', p4: '#facc15',
            boardA: '#fef3c7', boardB: '#fde68a', text: '#78350f',
            snake: '#166534', ladder: '#92400e'
        };

        const PLAYERS = [
            { id: 0, name: "Red", color: COLORS.p1, pos: 0, tx: 0, ty: 0, x: 0, y: 0 },
            { id: 1, name: "Blue", color: COLORS.p2, pos: 0, tx: 0, ty: 0, x: 0, y: 0 },
            { id: 2, name: "Green", color: COLORS.p3, pos: 0, tx: 0, ty: 0, x: 0, y: 0 },
            { id: 3, name: "Yellow", color: COLORS.p4, pos: 0, tx: 0, ty: 0, x: 0, y: 0 }
        ];

        // Maps start -> end
        const SNAKES = { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 };
        const LADDERS = { 1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100 };

        // --- GAME STATE ---
        let turn = 0; // Current player index
        let isAnimating = false;
        let numPlayers = 4; // Configurable

        // --- BOARD MATH ---

        // Returns {col, row} (0-9) for a position (1-100)
        // Row 0 is Top, Row 9 is Bottom.
        // Col 0 is Left, Col 9 is Right.
        function getGridPos(pos) {
            if (pos <= 0) return { col: -1, row: 9 }; // Off board to the left
            if (pos > 100) pos = 100;
            
            const p0 = pos - 1; // 0-99
            const rowFromBottom = Math.floor(p0 / 10); // 0-9
            const row = 9 - rowFromBottom; // 9-0
            
            let col = p0 % 10;
            if (rowFromBottom % 2 !== 0) {
                // Odd rows from bottom (like 11-20) go right to left
                col = 9 - col;
            }
            return { col, row };
        }

        // Returns physical center pixel coordinates {x, y} for a grid square
        function getCoords(pos) {
            const grid = getGridPos(pos);
            if (pos <= 0) {
                return { x: -ts/2, y: grid.row * ts + ts/2 }; // Offscreen start
            }
            return {
                x: grid.col * ts + ts / 2,
                y: grid.row * ts + ts / 2
            };
        }

        // --- DRAWING FUNCTIONS ---

        function resize() {
            // Fill available area while keeping square aspect ratio
            const parent = document.getElementById('game-area');
            const pRect = parent.getBoundingClientRect();
            
            const minDim = Math.min(pRect.width, pRect.height) * 0.95;
            size = Math.floor(minDim);
            
            // High DPI support
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
            ctx.scale(dpr, dpr);
            
            ts = size / 10;
            updateTargetPositions();
        }

        function drawBoard() {
            ctx.clearRect(0, 0, size, size);

            // Draw Checkered Grid
            for (let i = 1; i <= 100; i++) {
                const grid = getGridPos(i);
                const x = grid.col * ts;
                const y = grid.row * ts;

                ctx.fillStyle = (grid.col + grid.row) % 2 === 0 ? COLORS.boardA : COLORS.boardB;
                ctx.fillRect(x, y, ts, ts);

                // Grid Border
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, ts, ts);

                // Number
                ctx.fillStyle = COLORS.text;
                ctx.font = `bold ${ts * 0.25}px Nunito`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(i, x + ts * 0.08, y + ts * 0.08);

                // Start / Finish Text
                if(i === 1) {
                    ctx.font = `bold ${ts * 0.18}px Nunito`; ctx.fillStyle = '#ef4444';
                    ctx.fillText("START", x + ts * 0.08, y + ts * 0.4);
                }
                if(i === 100) {
                    ctx.font = `bold ${ts * 0.18}px Nunito`; ctx.fillStyle = '#16a34a';
                    ctx.fillText("FINISH", x + ts * 0.08, y + ts * 0.4);
                }
            }

            // Draw Ladders
            ctx.lineCap = 'round';
            for (const [start, end] of Object.entries(LADDERS)) {
                drawLadder(parseInt(start), end);
            }

            // Draw Snakes
            ctx.lineJoin = 'round';
            for (const [start, end] of Object.entries(SNAKES)) {
                drawSnake(parseInt(start), end);
            }
        }

        function drawLadder(startPos, endPos) {
            const start = getCoords(startPos);
            const end = getCoords(endPos);
            
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            const length = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);
            
            ctx.save();
            ctx.translate(start.x, start.y);
            ctx.rotate(angle);

            const width = ts * 0.3;
            ctx.strokeStyle = COLORS.ladder;
            ctx.lineWidth = ts * 0.08;

            // Two main poles
            ctx.beginPath();
            ctx.moveTo(0, -width/2); ctx.lineTo(length, -width/2);
            ctx.moveTo(0, width/2); ctx.lineTo(length, width/2);
            ctx.stroke();

            // Rungs
            ctx.lineWidth = ts * 0.06;
            const rungSpacing = ts * 0.4;
            const rungs = Math.floor(length / rungSpacing);
            
            ctx.beginPath();
            for (let i = 1; i <= rungs; i++) {
                const rX = i * (length / (rungs + 1));
                ctx.moveTo(rX, -width/2);
                ctx.lineTo(rX, width/2);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawSnake(startPos, endPos) {
            const start = getCoords(startPos); // Head
            const end = getCoords(endPos); // Tail
            
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            
            // Calculate a control point to curve the snake naturally
            const midX = (start.x + end.x) / 2;
            const midY = (start.y + end.y) / 2;
            
            // Perpendicular offset for curve
            const perpX = -dy * 0.2;
            const perpY = dx * 0.2;
            
            const cpX = midX + perpX;
            const cpY = midY + perpY;

            ctx.strokeStyle = COLORS.snake;
            ctx.lineWidth = ts * 0.2;
            
            // Shadow
            ctx.beginPath();
            ctx.moveTo(start.x, start.y + 5);
            ctx.quadraticCurveTo(cpX, cpY + 5, end.x, end.y + 5);
            ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            ctx.stroke();

            // Body
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.quadraticCurveTo(cpX, cpY, end.x, end.y);
            ctx.strokeStyle = COLORS.snake;
            ctx.stroke();

            // Pattern (diamonds)
            ctx.strokeStyle = '#facc15'; // Yellow diamonds
            ctx.lineWidth = ts * 0.05;
            ctx.setLineDash([ts*0.1, ts*0.2]);
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.quadraticCurveTo(cpX, cpY, end.x, end.y);
            ctx.stroke();
            ctx.setLineDash([]);

            // Head
            ctx.fillStyle = COLORS.snake;
            ctx.beginPath();
            ctx.arc(start.x, start.y, ts * 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            const angle = Math.atan2(cpY - start.y, cpX - start.x);
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(start.x + Math.cos(angle - 1)*ts*0.1, start.y + Math.sin(angle - 1)*ts*0.1, ts*0.06, 0, Math.PI*2);
            ctx.arc(start.x + Math.cos(angle + 1)*ts*0.1, start.y + Math.sin(angle + 1)*ts*0.1, ts*0.06, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(start.x + Math.cos(angle - 1)*ts*0.1, start.y + Math.sin(angle - 1)*ts*0.1, ts*0.03, 0, Math.PI*2);
            ctx.arc(start.x + Math.cos(angle + 1)*ts*0.1, start.y + Math.sin(angle + 1)*ts*0.1, ts*0.03, 0, Math.PI*2);
            ctx.fill();
            
            // Tongue
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(start.x - Math.cos(angle)*ts*0.2, start.y - Math.sin(angle)*ts*0.2);
            ctx.lineTo(start.x - Math.cos(angle)*ts*0.4, start.y - Math.sin(angle)*ts*0.4);
            ctx.stroke();
        }

        function drawTokens() {
            // Count tokens on each square to prevent overlap
            const counts = {};
            PLAYERS.forEach(p => {
                if(p.pos > 0) counts[p.pos] = (counts[p.pos] || 0) + 1;
            });

            PLAYERS.forEach((p, i) => {
                // Smooth interpolation (Lerp) towards target
                p.x += (p.tx - p.x) * 0.15;
                p.y += (p.ty - p.y) * 0.15;

                // Active player pulsates slightly
                const isActive = (i === turn && !isAnimating);
                const pulse = isActive ? Math.sin(Date.now() / 150) * 2 : 0;
                const radius = ts * 0.25 + pulse;

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath();
                ctx.arc(p.x + 2, p.y + 4, radius, 0, Math.PI * 2);
                ctx.fill();

                // Token Base
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fill();

                // Inner Detail
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(p.x - radius*0.3, p.y - radius*0.3, radius*0.2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function updateTargetPositions() {
            // Calculate overlapping offsets
            const offsets = {};
            PLAYERS.forEach(p => {
                if(!offsets[p.pos]) offsets[p.pos] = 0;
                const c = getCoords(p.pos);
                
                // If multiple tokens on same square, shift them
                let ox = 0, oy = 0;
                if(p.pos > 0) {
                    const idx = offsets[p.pos];
                    if (idx === 1) { ox = ts*0.2; oy = -ts*0.2; }
                    if (idx === 2) { ox = -ts*0.2; oy = ts*0.2; }
                    if (idx === 3) { ox = ts*0.2; oy = ts*0.2; }
                    offsets[p.pos]++;
                }

                p.tx = c.x + ox;
                p.ty = c.y + oy;

                // Snap immediately if not currently animating (like on resize)
                if(!isAnimating && Math.abs(p.tx - p.x) > ts*2) {
                    p.x = p.tx; p.y = p.ty;
                }
            });
        }

        // --- GAME LOGIC ---

        function initSidebar() {
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            for(let i=0; i<numPlayers; i++) {
                const p = PLAYERS[i];
                list.innerHTML += `
                    <div class="player-card ${i===0?'active':''}" id="pcard-${i}">
                        <div class="p-info">
                            <div class="color-dot" style="background: ${p.color};"></div>
                            <div class="player-name">${p.name}</div>
                        </div>
                        <div class="player-pos" id="ppos-${i}">0</div>
                    </div>
                `;
            }
        }

        function updateUI() {
            for(let i=0; i<numPlayers; i++) {
                document.getElementById(`pcard-${i}`).classList.toggle('active', i === turn);
                document.getElementById(`ppos-${i}`).innerText = PLAYERS[i].pos;
            }
        }

        function setLog(text) {
            document.getElementById('log-text').innerHTML = text;
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function rollDice() {
            if (isAnimating) return;
            initAudio();
            isAnimating = true;
            playSound('roll');

            const diceEl = document.getElementById('dice');
            diceEl.classList.add('rolling');
            document.getElementById('log-text').innerText = "Rolling...";
            
            let roll = 1;
            for(let i=0; i<15; i++) {
                roll = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = roll;
                await sleep(50);
            }
            diceEl.classList.remove('rolling');

            const p = PLAYERS[turn];
            setLog(`${p.name} rolled a ${roll}!`);
            await sleep(500);

            await movePlayer(p, roll);
        }

        async function movePlayer(p, roll) {
            // Need to land exactly on 100. Calculate bounce.
            let targetPos = p.pos + roll;
            let bounceBack = 0;
            if (targetPos > 100) {
                bounceBack = targetPos - 100;
                targetPos = 100;
            }

            // Hop forward
            for (let i = p.pos + 1; i <= targetPos; i++) {
                p.pos = i;
                updateTargetPositions();
                playSound('hop');
                document.getElementById(`ppos-${p.id}`).innerText = p.pos;
                await sleep(300);
            }

            // Bounce backward
            if (bounceBack > 0) {
                setLog("Too far! Bouncing back...");
                await sleep(300);
                for (let i = 1; i <= bounceBack; i++) {
                    p.pos--;
                    updateTargetPositions();
                    playSound('hop');
                    document.getElementById(`ppos-${p.id}`).innerText = p.pos;
                    await sleep(300);
                }
            }

            // Check Snake or Ladder
            if (SNAKES[p.pos]) {
                setLog("Oh no! A Snake!");
                playSound('snake');
                await sleep(500);
                p.pos = SNAKES[p.pos];
                updateTargetPositions();
                document.getElementById(`ppos-${p.id}`).innerText = p.pos;
                await sleep(800);
            } 
            else if (LADDERS[p.pos]) {
                setLog("Nice! A Ladder!");
                playSound('ladder');
                await sleep(500);
                p.pos = LADDERS[p.pos];
                updateTargetPositions();
                document.getElementById(`ppos-${p.id}`).innerText = p.pos;
                await sleep(800);
            }

            // Check Win
            if (p.pos === 100) {
                playSound('win');
                document.getElementById('win-title').innerText = `${p.name.toUpperCase()} WINS!`;
                document.getElementById('win-title').style.color = p.color;
                document.getElementById('win-modal').style.display = 'flex';
                return; // Game over, stop animation flag stays true
            }

            // Turn logic
            if (roll === 6) {
                setLog(`${p.name} rolled a 6! Extra turn.`);
            } else {
                turn = (turn + 1) % numPlayers;
                updateUI();
                setLog(`${PLAYERS[turn].name}'s turn!`);
            }

            isAnimating = false;
        }

        function startGame() {
            initAudio();
            document.getElementById('start-modal').style.display = 'none';
            initSidebar();
            
            // Set initial positions off-board properly
            PLAYERS.forEach(p => { 
                p.pos = 0; 
                const c = getCoords(0);
                p.x = c.x; p.y = c.y; p.tx = c.x; p.ty = c.y;
            });
            updateTargetPositions();
            
            setLog(`${PLAYERS[turn].name}'s turn!`);
            render();
        }

        // --- RENDER LOOP ---

        function render() {
            requestAnimationFrame(render);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBoard();
            drawTokens();
        }

        window.addEventListener('resize', resize);
        resize();

    </script>
</body>
</html>
