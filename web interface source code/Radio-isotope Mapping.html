<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Medicine: Radio-isotope Mapping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #020617; /* slate-950 */
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: none;
        }

        .sci-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Scanning line effect */
        @keyframes scanline {
            0% { top: 0%; opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .scan-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #22d3ee, transparent);
            box-shadow: 0 0 15px #06b6d4;
            z-index: 10;
            pointer-events: none;
            animation: scanline 4s linear infinite;
        }

        /* Ambient HUD animations */
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .hud-pulse {
            animation: pulse-soft 2s infinite ease-in-out;
        }

        canvas {
            filter: blur(4px); /* Soften the radio-emission glow */
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col md:flex-row relative bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

    <!-- Laboratory HUD -->
    <div class="absolute top-0 left-0 w-full p-6 md:p-10 z-20 pointer-events-none flex flex-col md:flex-row justify-between items-start gap-6">
        <div class="sci-panel p-8 rounded-2xl max-w-lg pointer-events-auto">
            <div class="flex items-center gap-3 mb-3">
                <div class="h-[1px] w-10 bg-cyan-500"></div>
                <span class="text-cyan-400 font-mono text-[10px] tracking-widest uppercase">Nuclear Medicine Dept.</span>
            </div>
            <h1 class="text-3xl font-extrabold text-white mb-2 tracking-tight">
                Radio-isotope <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">Mapping</span>
            </h1>
            <p class="text-slate-400 text-xs leading-relaxed mb-6 font-light">
                Visualize tracer distribution in real-time. Select an isotope to simulate physiological uptake and identify high-metabolic "hotspots" used in clinical diagnosis.
            </p>
            
            <div class="space-y-4">
                <label class="text-[10px] text-slate-500 uppercase font-mono tracking-widest block">Active Tracer Profile</label>
                <div class="grid grid-cols-1 gap-2">
                    <button onclick="setTracer('fdg')" id="btn-fdg" class="tracer-btn flex justify-between items-center bg-slate-800 hover:bg-slate-700 p-3 rounded-xl border border-transparent border-cyan-500 transition">
                        <div class="text-left">
                            <span class="text-xs font-bold text-white block">¹⁸F-FDG</span>
                            <span class="text-[10px] text-slate-400">Glucose Metabolism (PET)</span>
                        </div>
                        <div class="text-[10px] font-mono text-cyan-400">T½: 110m</div>
                    </button>
                    <button onclick="setTracer('iodine')" id="btn-iodine" class="tracer-btn flex justify-between items-center bg-slate-800 hover:bg-slate-700 p-3 rounded-xl border border-transparent transition">
                        <div class="text-left">
                            <span class="text-xs font-bold text-white block">¹³¹I-Sodium Iodide</span>
                            <span class="text-[10px] text-slate-400">Thyroid Uptake (SPECT)</span>
                        </div>
                        <div class="text-[10px] font-mono text-indigo-400">T½: 8d</div>
                    </button>
                    <button onclick="setTracer('technetium')" id="btn-technetium" class="tracer-btn flex justify-between items-center bg-slate-800 hover:bg-slate-700 p-3 rounded-xl border border-transparent transition">
                        <div class="text-left">
                            <span class="text-xs font-bold text-white block">⁹⁹ᵐTc-MDP</span>
                            <span class="text-[10px] text-slate-400">Bone Scintigraphy</span>
                        </div>
                        <div class="text-[10px] font-mono text-emerald-400">T½: 6h</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Panel: Telemetry -->
        <div class="sci-panel p-6 rounded-2xl pointer-events-auto min-w-[240px]">
            <h3 class="text-[10px] font-mono text-slate-500 uppercase tracking-widest mb-4">Live Scintigraphy Data</h3>
            <div class="space-y-6">
                <div>
                    <span class="text-[10px] text-slate-500 block mb-1">DETECTION RATE</span>
                    <div class="flex items-end gap-2">
                        <span id="count-rate" class="text-3xl font-bold text-white tabular-nums">0</span>
                        <span class="text-xs text-slate-500 mb-1">CPS</span>
                    </div>
                </div>
                <div>
                    <span class="text-[10px] text-slate-500 block mb-1">SIGNAL INTENSITY</span>
                    <div class="w-full h-1 bg-slate-800 rounded-full overflow-hidden mt-2">
                        <div id="intensity-bar" class="h-full bg-cyan-500 w-0 transition-all duration-300"></div>
                    </div>
                </div>
                <div class="p-3 bg-black/40 rounded-lg border border-slate-700/50">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] text-slate-400">SYSTEM STATUS</span>
                        <div class="w-2 h-2 rounded-full bg-green-500 hud-pulse"></div>
                    </div>
                    <span id="system-status" class="text-[10px] font-mono text-cyan-400">READY TO SCAN</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Scanning Viewport -->
    <div class="w-full h-full flex items-center justify-center p-4 relative" id="scan-viewport">
        
        <!-- Silhouette & Canvas Container -->
        <div class="relative w-[300px] h-[700px] max-h-[85vh]">
            <!-- Body Silhouette SVG -->
            <svg viewBox="0 0 200 500" class="absolute inset-0 w-full h-full">
                <defs>
                    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#1e293b" />
                        <stop offset="100%" stop-color="#0f172a" />
                    </linearGradient>
                </defs>
                <!-- Simplified Anatomical Human Outline -->
                <path d="M 100,20 C 110,20 120,30 120,45 C 120,60 110,70 100,70 C 90,70 80,60 80,45 C 80,30 90,20 100,20 Z" fill="url(#bodyGrad)" stroke="#334155" /> <!-- Head -->
                <path d="M 100,70 L 100,90 M 70,100 Q 100,90 130,100 L 140,200 L 120,200 L 115,130 L 85,130 L 80,200 L 60,200 L 70,100 Z" fill="url(#bodyGrad)" stroke="#334155" /> <!-- Arms/Torso Upper -->
                <path d="M 85,130 L 115,130 L 115,280 Q 100,290 85,280 Z" fill="url(#bodyGrad)" stroke="#334155" /> <!-- Torso -->
                <path d="M 85,280 L 75,480 L 95,480 L 100,320 L 105,480 L 125,480 L 115,280" fill="url(#bodyGrad)" stroke="#334155" /> <!-- Legs -->
                
                <!-- Skeleton/Organ Guideline Hints (Low opacity) -->
                <g stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.05">
                    <circle cx="100" cy="115" r="5" /> <!-- Thyroid area -->
                    <rect x="88" y="140" width="24" height="40" rx="4" /> <!-- Heart/Lungs area -->
                    <path d="M 90,220 Q 100,210 110,220" /> <!-- Liver area -->
                    <path d="M 100,100 L 100,300" /> <!-- Spine -->
                </g>
            </svg>

            <!-- Emission Layer (Canvas) -->
            <canvas id="emission-canvas" width="300" height="700" class="absolute inset-0 z-0 pointer-events-none"></canvas>

            <!-- Scanning Animation -->
            <div class="scan-bar"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('emission-canvas');
            const ctx = canvas.getContext('2d');
            const countRateEl = document.getElementById('count-rate');
            const intensityBar = document.getElementById('intensity-bar');
            const systemStatus = document.getElementById('system-status');

            // Tracer Data Profiles
            const tracers = {
                fdg: {
                    color: 'rgba(34, 211, 238,', // Cyan
                    hotspots: [
                        { x: 150, y: 45, r: 25, intensity: 0.8 },  // Brain (High metabolic)
                        { x: 150, y: 160, r: 20, intensity: 0.9 }, // Heart
                        { x: 130, y: 250, r: 15, intensity: 0.6 }, // Left Kidney
                        { x: 170, y: 250, r: 15, intensity: 0.6 }, // Right Kidney
                        { x: 150, y: 310, r: 18, intensity: 1.0 }, // Bladder (Excretion)
                        { x: 165, y: 210, r: 12, intensity: 0.7 }  // "Tumor" hotspot in liver area
                    ]
                },
                iodine: {
                    color: 'rgba(129, 140, 248,', // Indigo
                    hotspots: [
                        { x: 150, y: 110, r: 18, intensity: 1.0 }, // Thyroid (Specific uptake)
                        { x: 150, y: 310, r: 12, intensity: 0.4 }  // Bladder (Minor excretion)
                    ]
                },
                technetium: {
                    color: 'rgba(52, 211, 153,', // Emerald
                    hotspots: [
                        { x: 150, y: 100, r: 10, intensity: 0.5 }, // C-Spine
                        { x: 150, y: 200, r: 10, intensity: 0.6 }, // T-Spine
                        { x: 150, y: 280, r: 15, intensity: 0.8 }, // Pelvis
                        { x: 110, y: 100, r: 12, intensity: 0.5 }, // Shoulders
                        { x: 190, y: 100, r: 12, intensity: 0.5 },
                        { x: 115, y: 340, r: 10, intensity: 0.4 }, // Knees
                        { x: 185, y: 340, r: 10, intensity: 0.4 }
                    ]
                }
            };

            let currentTracer = 'fdg';
            let currentCPS = 0;
            let targetCPS = 0;

            window.setTracer = (key) => {
                currentTracer = key;
                
                // UI Toggle
                document.querySelectorAll('.tracer-btn').forEach(b => b.classList.remove('border-cyan-500', 'border-indigo-500', 'border-emerald-500'));
                const btn = document.getElementById(`btn-${key}`);
                const colorClass = key === 'fdg' ? 'border-cyan-500' : (key === 'iodine' ? 'border-indigo-500' : 'border-emerald-500');
                btn.classList.add(colorClass);

                systemStatus.textContent = "SYNCHRONIZING TRACER...";
                setTimeout(() => {
                    systemStatus.textContent = "COLLECTING EMISSIONS";
                    systemStatus.className = "text-[10px] font-mono " + (key === 'fdg' ? 'text-cyan-400' : (key === 'iodine' ? 'text-indigo-400' : 'text-emerald-400'));
                }, 800);
            };

            function drawHotspots() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'screen'; // Additive blending for glow

                const tracer = tracers[currentTracer];
                const time = Date.now() / 1000;

                tracer.hotspots.forEach(spot => {
                    // Subtle flickering based on radioactive decay randomness
                    const flicker = 0.95 + Math.random() * 0.1;
                    const breath = Math.sin(time * 2 + spot.x) * 0.05;
                    const finalIntensity = spot.intensity * flicker + breath;

                    const grad = ctx.createRadialGradient(spot.x, spot.y, 0, spot.x, spot.y, spot.r * 2);
                    grad.addColorStop(0, tracer.color + finalIntensity + ')');
                    grad.addColorStop(0.4, tracer.color + (finalIntensity * 0.4) + ')');
                    grad.addColorStop(1, tracer.color + '0)');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(spot.x, spot.y, spot.r * 2, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Update HUD Telemetry
                targetCPS = currentTracer === 'fdg' ? 12450 : (currentTracer === 'iodine' ? 4200 : 8900);
                // Add some jitter
                targetCPS += (Math.random() - 0.5) * 500;
                currentCPS += (targetCPS - currentCPS) * 0.1;
                countRateEl.textContent = Math.floor(currentCPS).toLocaleString();
                
                const intensity = (currentCPS / 15000) * 100;
                intensityBar.style.width = `${intensity}%`;
                intensityBar.style.backgroundColor = currentTracer === 'fdg' ? '#22d3ee' : (currentTracer === 'iodine' ? '#818cf8' : '#34d499');

                requestAnimationFrame(drawHotspots);
            }

            // Initial call
            setTracer('fdg');
            drawHotspots();
        });
    </script>
</body>
</html>
