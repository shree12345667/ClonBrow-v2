<!DOCTYPE html>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Minimalist Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        /* Custom Animations */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
            50% { box-shadow: 0 0 10px 0 rgba(59, 130, 246, 0.2); }
        }

        @keyframes load-bar {
            0% { width: 0%; opacity: 1; }
            50% { width: 70%; opacity: 1; }
            100% { width: 100%; opacity: 0; }
        }

        .anim-focus:focus-within {
            animation: pulse-glow 2s infinite;
        }

        .loading-active {
            animation: load-bar 1.5s ease-out forwards;
        }

        /* Neo-Brutalist Styles */
        .brutal-box {
            border: 3px solid #111827;
            box-shadow: 6px 6px 0px 0px #111827;
            transition: all 0.15s ease;
            border-radius: 0;
        }
        .brutal-box:focus-within, .brutal-box:active {
            box-shadow: 2px 2px 0px 0px #111827;
            transform: translate(4px, 4px);
        }
        .brutal-btn {
            border: 2px solid transparent;
            transition: all 0.15s ease;
            border-radius: 0;
        }
        .brutal-btn:hover {
            border: 2px solid #111827;
            box-shadow: 4px 4px 0px 0px #111827;
            transform: translate(-2px, -2px);
        }

        /* Crawler Terminal Text Effect */
        .typing-cursor::after {
            content: '█';
            animation: blink 1s step-start infinite;
            color: #3b82f6;
            margin-left: 4px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Glassmorphism overlays */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Hide scrollbar for tabs */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

    <script type="module">

        // --- Status Tracking Logic ---
        window.updateUserStatus = async function(statusText) {

        };

        function getTabStatus(url) {
            if (url === HOME_URL) return "Browsing Dashboard";
            if (url.includes('arcade.html')) return "Playing Games";
            if (url.includes('medicof all.html') || url.includes('netlify.app')) return "In Clinical Labs";
            return "Surfing the Web";
        }

        // --- Tabs Architecture ---
        function generateId() {
            return 'tab-' + Math.random().toString(36).substr(2, 9);
        }

        function createNewTab(url = HOME_URL) {
            const tab = {
                id: generateId(),
                url: url,
                title: url === HOME_URL ? 'New Tab' : getDomain(url),
                history: [url],
                historyIndex: 0,
                iframe: null
            };
            tabs.push(tab);
            switchTab(tab.id);
        }

        function getDomain(url) {
            try {
                if (url.includes('netlify.app')) return 'ClonMedic Lab';
                if (!url.startsWith('http') && url.includes('.html')) {
                    return url.replace('.html', '').toUpperCase();
                }
                return new URL(url).hostname.replace('www.', '');
            } catch (e) {
                return url;
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            
            tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const tabEl = document.createElement('div');
                
                // Brutalist Active/Inactive Tabs
                const activeClasses = 'bg-white border-2 border-gray-900 border-b-0 relative z-10 before:absolute before:-bottom-1 before:left-0 before:right-0 before:h-1.5 before:bg-white text-gray-900 font-bold';
                const inactiveClasses = 'bg-gray-300 border-2 border-transparent border-b-gray-900 text-gray-600 hover:bg-gray-400 font-medium';
                
                tabEl.className = `group flex items-center justify-between px-3 py-2 min-w-[150px] max-w-[220px] cursor-pointer transition-colors text-sm ${isActive ? activeClasses : inactiveClasses}`;
                tabEl.onclick = () => switchTab(tab.id);
                
                // Dynamic Icon Context
                let iconClass = 'fa-globe text-gray-400';
                if (tab.url === HOME_URL) iconClass = 'fa-house text-blue-400';
                else if (tab.url.includes('netlify.app')) iconClass = 'fa-microscope text-blue-500';

                tabEl.innerHTML = `
                    <div class="flex items-center gap-2 truncate pointer-events-none">
                        <i class="fas ${iconClass} text-xs"></i>
                        <span class="truncate font-medium">${tab.title}</span>
                    </div>
                    <button onclick="closeTab(event, '${tab.id}')" class="opacity-0 group-hover:opacity-100 hover:bg-gray-300 rounded-md w-5 h-5 flex items-center justify-center transition-all text-gray-500">
                        <i class="fas fa-times text-[10px]"></i>
                    </button>
                `;
                container.appendChild(tabEl);
            });
        }

        function switchTab(id) {
            activeTabId = id;
            const tab = tabs.find(t => t.id === id);
            if (!tab) return;

            renderTabs();
            searchOverlay.classList.add('hidden'); // Close crawler when switching tabs

            // Re-sync UI state to current tab
            if (tab.url === HOME_URL) {
                homeScreen.classList.remove('hidden');
                addressBar.value = '';
                homeSearchBar.value = '';
                
                Array.from(iframeContainer.children).forEach(f => f.classList.add('hidden'));
            } else {
                homeScreen.classList.add('hidden');
                addressBar.value = tab.url;
                
                if (!tab.iframe) {
                    const iframe = document.createElement('iframe');
                    iframe.className = 'w-full h-full border-none absolute inset-0 bg-white';
                    iframe.src = tab.url;
                    iframeContainer.appendChild(iframe);
                    tab.iframe = iframe;
                }
                
                Array.from(iframeContainer.children).forEach(f => f.classList.add('hidden'));
                tab.iframe.classList.remove('hidden');
            }

            // Update status if dashboard is not open
            if (document.getElementById('dashboard-modal').classList.contains('hidden')) {
                window.updateUserStatus(getTabStatus(tab.url));
            }
        }

        function closeTab(e, id) {
            e.stopPropagation(); 
            
            if (tabs.length === 1) {
                const tab = tabs[0];
                if (tab.iframe) tab.iframe.remove();
                tabs = [];
                createNewTab();
                return;
            }

            const tabIndex = tabs.findIndex(t => t.id === id);
            const tab = tabs[tabIndex];
            
            if (tab.iframe) tab.iframe.remove();
            tabs.splice(tabIndex, 1);
            
            if (activeTabId === id) {
                const newIndex = Math.max(0, tabIndex - 1);
                switchTab(tabs[newIndex].id);
            } else {
                renderTabs();
            }
        }

        // --- Interaction Handlers ---
        addressBar.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if(this.value.trim() === '') loadWebPage(HOME_URL);
                else processInput(this.value.trim());
                this.blur();
            }
        });

        homeSearchBar.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if(this.value.trim() !== '') {
                    addressBar.value = this.value.trim();
                    processInput(this.value.trim());
                }
                this.blur();
            }
        });

        function processInput(input) {
            triggerLoadAnimation();
            const urlPattern = /^(https?:\/\/)?([\w.-]+)\.([a-z]{2,6}\.?)(\/[\w.-]*)*\/?$/i;
            
            if (urlPattern.test(input) || input.startsWith('http')) {
                let finalUrl = input.startsWith('http') ? input : 'https://' + input;
                loadWebPage(finalUrl);
            } else {
                executeCrawler(input);
            }
        }

        function loadWebPage(url) {
            const tab = tabs.find(t => t.id === activeTabId);
            if (!tab) return;

            tab.url = url;
            tab.title = url === HOME_URL ? 'New Tab' : getDomain(url);
            
            if (tab.history[tab.historyIndex] !== url) {
                tab.history = tab.history.slice(0, tab.historyIndex + 1);
                tab.history.push(url);
                tab.historyIndex++;
            }

            if (tab.iframe && url !== HOME_URL) {
                tab.iframe.src = url;
            }

            switchTab(activeTabId);
        }

        function goBack() {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab && tab.historyIndex > 0) {
                tab.historyIndex--;
                triggerLoadAnimation();
                tab.url = tab.history[tab.historyIndex];
                tab.title = tab.url === HOME_URL ? 'New Tab' : getDomain(tab.url);
                if(tab.iframe && tab.url !== HOME_URL) tab.iframe.src = tab.url;
                switchTab(activeTabId);
            }
        }

        function goForward() {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab && tab.historyIndex < tab.history.length - 1) {
                tab.historyIndex++;
                triggerLoadAnimation();
                tab.url = tab.history[tab.historyIndex];
                tab.title = tab.url === HOME_URL ? 'New Tab' : getDomain(tab.url);
                if(tab.iframe && tab.url !== HOME_URL) tab.iframe.src = tab.url;
                switchTab(activeTabId);
            }
        }

        function reloadPage() {
            triggerLoadAnimation();
            if(!searchOverlay.classList.contains('hidden')){
                executeCrawler(addressBar.value);
            } else {
                const tab = tabs.find(t => t.id === activeTabId);
                if(tab && tab.iframe && tab.url !== HOME_URL) {
                    tab.iframe.src = tab.iframe.src;
                }
            }
        }

        function goHome() {
            triggerLoadAnimation();
            loadWebPage(HOME_URL);
        }

        // --- Core Indexer API ---
        async function executeCrawler(query) {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab && tab.iframe) tab.iframe.classList.add('hidden');
            
            homeScreen.classList.add('hidden'); 
            searchOverlay.classList.remove('hidden'); 
            window.updateUserStatus('Deep Indexing');
            
            addressBar.value = query;
            searchResults.innerHTML = '';
            
            crawlerStatus.textContent = `Deploying crawler nodes for: "${query}"...`;
            setTimeout(() => { crawlerStatus.textContent = `Indexing global databases for: "${query}"...`; }, 600);

            try {
                const response = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`);
                const data = await response.json();
                
                setTimeout(() => { renderSearchResults(data.query.search, query); }, 1200);
            } catch (error) {
                crawlerStatus.textContent = `Crawler encountered an anomaly. Connection failed.`;
                crawlerStatus.classList.remove('typing-cursor');
                searchResults.innerHTML = `<div class="text-red-500 bg-red-50 p-4 rounded-xl border border-red-100">Unable to index the web at this moment.</div>`;
            }
        }

        function renderSearchResults(results, query) {
            crawlerStatus.textContent = `Index complete. Found ${results.length} highly relevant nodes for "${query}".`;
            crawlerStatus.classList.remove('typing-cursor');

            if (results.length === 0) {
                searchResults.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-ghost text-4xl text-gray-300 mb-4 block"></i>
                        <h3 class="text-lg text-gray-600">No nodes found for "${query}"</h3>
                    </div>`;
                return;
            }

            results.forEach((result, index) => {
                const articleUrl = `https://en.wikipedia.org/wiki/${encodeURIComponent(result.title)}`;
                const delay = index * 100; 
                const card = document.createElement('div');
                
                card.className = `group bg-white p-6 border-4 border-gray-900 shadow-[6px_6px_0_0_rgba(17,24,39,1)] hover:shadow-[2px_2px_0_0_rgba(17,24,39,1)] hover:translate-y-[4px] hover:translate-x-[4px] transition-all duration-150 transform opacity-0`;
                card.style.animation = `fadeUp 0.5s ease forwards ${delay}ms`;
                
                card.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="pt-1 hidden sm:block">
                            <div class="w-10 h-10 bg-gray-100 border-2 border-gray-900 flex items-center justify-center text-gray-900 group-hover:bg-blue-400 transition-colors">
                                <i class="fas fa-globe text-sm"></i>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-xs font-mono text-gray-900 bg-gray-200 px-2 py-0.5 border border-gray-900">NODE:${result.pageid}</span>
                                <span class="text-xs text-blue-600 font-bold uppercase tracking-wider">ClonMedic Index</span>
                            </div>
                            <a href="#" onclick="loadWebPage('${articleUrl}'); return false;" class="text-xl font-bold text-gray-900 group-hover:text-blue-600 transition-colors block mb-2 font-mono">
                                ${result.title}
                            </a>
                            <p class="text-gray-700 text-sm leading-relaxed font-sans">${result.snippet}...</p>
                        </div>
                    </div>
                `;
                searchResults.appendChild(card);
            });
        }

        const style = document.createElement('style');
        style.innerHTML = `@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }`;
        document.head.appendChild(style);

        // --- User Dashboard, Firebase & Chat Logic ---
        const dashboardModal = document.getElementById('dashboard-modal');
        const authView = document.getElementById('auth-view');
        const dashboardView = document.getElementById('dashboard-view');
        const authTitle = document.getElementById('auth-title');
        const authSwitchText = document.getElementById('auth-switch-text');
        const authUsername = document.getElementById('auth-username');
        const displayUsername = document.getElementById('display-username');
        const pfpImage = document.getElementById('user-pfp');
        const authError = document.getElementById('auth-error');
        const authBtn = document.getElementById('auth-btn');

        let isRegistering = false;
        let currentUser = null;
        let unsubscribeDoc = null;
        let unsubscribeChat = null;
        let unsubscribePresence = null;
        let unsubscribeFriendships = null;

        let latestPresenceData = [];
        let globalFriendships = [];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                authError.classList.add('hidden');
                loadUserData();
                if (dashboardModal.classList.contains('flex')) {
                    initChatAndPresence();
                }
            } else {
                currentUser = null;
                authView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
                if (unsubscribeDoc) { unsubscribeDoc(); unsubscribeDoc = null; }
                if (unsubscribeChat) { unsubscribeChat(); unsubscribeChat = null; }
                if (unsubscribePresence) { unsubscribePresence(); unsubscribePresence = null; }
                if (unsubscribeFriendships) { unsubscribeFriendships(); unsubscribeFriendships = null; }
            }
        });

        async function loadUserData() {
            if (!currentUser) return;
            const profileRef = doc(db, 'artifacts', CLONBROW_APP_ID, 'users', currentUser.uid, 'profile', 'main');
            
            unsubscribeDoc = onSnapshot(profileRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    displayUsername.textContent = data.username || "Dr. Guest";
                    document.getElementById('user-bio').value = data.bio || "";
                    if (data.pfp) {
                        pfpImage.src = data.pfp;
                    } else {
                        pfpImage.src = `https://api.dicebear.com/7.x/bottts/svg?seed=${data.username || 'clonmedic'}`;
                    }
                    // Update status with fresh data
                    window.updateUserStatus('Chatting in Hub');
                }
            });
        }

        function initChatAndPresence() {
            // Friendships Sync
            const friendshipsQuery = query(collection(db, 'artifacts', CLONBROW_APP_ID, 'public', 'data', 'friendships'));
            unsubscribeFriendships = onSnapshot(friendshipsQuery, (snapshot) => {
                globalFriendships = [];
                snapshot.forEach(docSnap => globalFriendships.push({ id: docSnap.id, ...docSnap.data() }));
                renderFriendRequests();
                renderPresence();
            });

            // Live Presence Sync
            const presenceQuery = query(collection(db, 'artifacts', CLONBROW_APP_ID, 'public', 'data', 'presence'));
            unsubscribePresence = onSnapshot(presenceQuery, (snapshot) => {
                latestPresenceData = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    // Basic cleanup for stale status (older than 1 hr)
                    if(data.timestamp && (Date.now() - data.timestamp.toMillis() > 3600000)) return; 
                    latestPresenceData.push(data);
                });
                renderPresence();
            });

            // Live Chat Sync
            const chatBox = document.getElementById('chat-messages');
            const chatQuery = query(collection(db, 'artifacts', CLONBROW_APP_ID, 'public', 'data', 'global_chat'), orderBy('timestamp', 'desc'), limit(30));
            
            unsubscribeChat = onSnapshot(chatQuery, (snapshot) => {
                const msgs = [];
                snapshot.forEach(doc => msgs.push(doc.data()));
                
                chatBox.innerHTML = '';
                msgs.reverse().forEach(msg => {
                    const isMe = currentUser && msg.uid === currentUser.uid;
                    const msgEl = document.createElement('div');
                    msgEl.className = `flex gap-3 ${isMe ? 'flex-row-reverse' : 'flex-row'}`;
                    msgEl.innerHTML = `
                        <img src="${msg.pfp}" class="w-10 h-10 rounded-full border-2 border-white shadow-sm object-cover bg-white shrink-0 mt-1">
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[75%]">
                            <span class="text-xs font-bold text-gray-500 mb-1 px-1">${msg.username}</span>
                            <div class="p-3 font-bold text-sm ${isMe ? 'bg-[#ffc107] text-gray-900 rounded-2xl rounded-tr-sm shadow-[0_3px_0_0_#d39e00]' : 'bg-white text-gray-800 rounded-2xl rounded-tl-sm shadow-[0_3px_0_0_#e5e7eb] border-2 border-gray-100'}">
                                ${msg.text}
                            </div>
                        </div>
                    `;
                    chatBox.appendChild(msgEl);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function renderPresence() {
            const usersList = document.getElementById('active-users-list');
            usersList.innerHTML = '';
            let hasUsers = false;

            latestPresenceData.forEach(data => {
                hasUsers = true;
                const isMe = currentUser && data.uid === currentUser.uid;
                
                let friendshipStatus = 'none';
                let friendshipId = null;
                
                if (currentUser && !isMe) {
                    const relation = globalFriendships.find(f => 
                        (f.senderId === currentUser.uid && f.receiverId === data.uid) ||
                        (f.senderId === data.uid && f.receiverId === currentUser.uid)
                    );
                    
                    if (relation) {
                        friendshipId = relation.id;
                        if (relation.status === 'accepted') friendshipStatus = 'friends';
                        else if (relation.senderId === currentUser.uid) friendshipStatus = 'pending_sent';
                        else friendshipStatus = 'pending_received';
                    }
                }

                let badgeActionHtml = '';
                if (!isMe && currentUser) {
                    if (friendshipStatus === 'none') {
                        badgeActionHtml = `<button onclick="sendFriendRequest('${data.uid}', '${data.username.replace(/'/g, "\\'")}', '${data.pfp}')" class="absolute -top-2 -right-2 w-6 h-6 bg-[#1CA5EB] rounded-full text-white text-xs border-2 border-white opacity-0 group-hover:opacity-100 transition-opacity hover:bg-blue-600 shadow-sm flex items-center justify-center z-10" title="Add Friend"><i class="fas fa-plus"></i></button>`;
                    } else if (friendshipStatus === 'friends') {
                        badgeActionHtml = `<div class="absolute -top-2 -right-2 w-6 h-6 bg-[#ffc107] rounded-full text-white text-xs border-2 border-white shadow-sm flex items-center justify-center z-10" title="Friend"><i class="fas fa-star"></i></div>`;
                    } else if (friendshipStatus === 'pending_sent') {
                        badgeActionHtml = `<div class="absolute -top-2 -right-2 w-6 h-6 bg-gray-400 rounded-full text-white text-xs border-2 border-white shadow-sm flex items-center justify-center z-10" title="Request Sent"><i class="fas fa-clock"></i></div>`;
                    }
                }

                const userBadge = document.createElement('div');
                userBadge.className = "flex flex-col items-center gap-1 min-w-[70px] group cursor-default relative";
                userBadge.innerHTML = `
                    <div class="relative">
                        <img src="${data.pfp}" class="w-12 h-12 rounded-[1rem] border-2 ${friendshipStatus === 'friends' ? 'border-[#ffc107]' : 'border-white'} shadow-sm object-cover bg-gray-200 group-hover:scale-110 transition-transform">
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full z-10"></div>
                        ${badgeActionHtml}
                    </div>
                    <div class="text-[10px] font-bold text-gray-800 truncate w-full text-center mt-1">${data.username}</div>
                    <div class="text-[9px] font-bold text-[#1CA5EB] bg-blue-100 px-2 rounded-full truncate w-full text-center">${data.status || 'Online'}</div>
                `;
                usersList.appendChild(userBadge);
            });

            if(!hasUsers) usersList.innerHTML = '<div class="text-sm text-gray-400 font-bold">No active connections found.</div>';
        }

        function renderFriendRequests() {
            if (!currentUser) return;
            const requestsArea = document.getElementById('friend-requests-area');
            const requestsList = document.getElementById('requests-list');
            requestsList.innerHTML = '';
            
            const incomingRequests = globalFriendships.filter(f => f.receiverId === currentUser.uid && f.status === 'pending');
            
            if (incomingRequests.length > 0) {
                requestsArea.classList.remove('hidden');
                requestsArea.classList.add('flex');
                
                incomingRequests.forEach(req => {
                    const reqEl = document.createElement('div');
                    reqEl.className = "bg-white p-2 rounded-xl shadow-sm border-2 border-yellow-200 flex justify-between items-center";
                    reqEl.innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${req.senderPfp}" class="w-10 h-10 rounded-[1rem] border-2 border-gray-100 object-cover">
                            <span class="text-sm font-black text-gray-800">${req.senderName}</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="acceptRequest('${req.id}')" class="bg-green-500 hover:bg-green-600 text-white w-8 h-8 rounded-full flex items-center justify-center transition-colors shadow-sm"><i class="fas fa-check"></i></button>
                            <button onclick="rejectRequest('${req.id}')" class="bg-red-500 hover:bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center transition-colors shadow-sm"><i class="fas fa-times"></i></button>
                        </div>
                    `;
                    requestsList.appendChild(reqEl);
                });
            } else {
                requestsArea.classList.add('hidden');
                requestsArea.classList.remove('flex');
            }
        }

        window.sendFriendRequest = async function(receiverId, receiverName, receiverPfp) {
            if (!currentUser) return;
            try {
                await addDoc(collection(db, 'artifacts', CLONBROW_APP_ID, 'public', 'data', 'friendships'), {
                    senderId: currentUser.uid,
                    senderName: document.getElementById('display-username').textContent,
                    senderPfp: document.getElementById('user-pfp').src,
                    receiverId: receiverId,
                    receiverName: receiverName,
                    receiverPfp: receiverPfp,
                    status: 'pending',
                    timestamp: serverTimestamp()
                });
            } catch(e) { console.error("Error sending request", e); }
        };

        window.acceptRequest = async function(requestId) {
            if (!currentUser) return;
            try {
                const reqRef = doc(db, 'artifacts', CLONBROW_APP_ID, 'public', 'data', 'friendships', requestId);
                await updateDoc(reqRef, { status: 'accepted' });
            } catch(e) { console.error("Error accepting request", e); }
        };

        window.rejectRequest = async function(requestId) {
            if (!currentUser) return;
            try {
                const reqRef = doc(db, 'artifacts', CLONBROW_APP_ID, 'public', 'data', 'friendships', requestId);
                await deleteDoc(reqRef);
            } catch(e) { console.error("Error rejecting request", e); }
        };

        window.sendChatMessage = async function() {
            if (!currentUser) return;
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            
            await addDoc(collection(db, 'artifacts', CLONBROW_APP_ID, 'public', 'data', 'global_chat'), {
                uid: currentUser.uid,
                username: document.getElementById('display-username').textContent || "User",
                pfp: document.getElementById('user-pfp').src,
                text: text,
                timestamp: serverTimestamp()
            });
            window.updateUserStatus('Chatting in Hub');
        };

        window.openDashboard = function() {
            dashboardModal.classList.remove('hidden');
            dashboardModal.classList.add('flex');
            
            if (currentUser) {
                authView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                if(!unsubscribeChat) initChatAndPresence();
                window.updateUserStatus('Browsing Dashboard');
            } else {
                authView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
            }
        };

        window.closeDashboard = function() {
            dashboardModal.classList.add('hidden');
            dashboardModal.classList.remove('flex');
            const tab = tabs.find(t => t.id === activeTabId);
            if(tab) window.updateUserStatus(getTabStatus(tab.url));
        };

        window.toggleAuthMode = function() {
            isRegistering = !isRegistering;
            authError.classList.add('hidden');
            if (isRegistering) {
                authTitle.textContent = "Register Identity";
                authSwitchText.textContent = "Existing User? System Login";
            } else {
                authTitle.textContent = "System Login";
                authSwitchText.textContent = "New User? Register Identity";
            }
        };

        window.handleAuth = async function() {
            const rawUsername = authUsername.value.trim();
            const password = document.getElementById('auth-password').value;
            
            if (!rawUsername || !password) {
                authError.textContent = "Credentials required.";
                authError.classList.remove('hidden');
                return;
            }

            const email = rawUsername.toLowerCase().replace(/[^a-z0-9]/g, '') + "@clonmed.os";
            
            authBtn.innerHTML = "PROCESSING... <i class='fas fa-spinner fa-spin ml-2'></i>";
            authError.classList.add('hidden');

            try {
                if (isRegistering) {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, 'artifacts', CLONBROW_APP_ID, 'users', cred.user.uid, 'profile', 'main'), {
                        username: rawUsername,
                        bio: "",
                        pfp: `https://api.dicebear.com/7.x/bottts/svg?seed=${rawUsername}`,
                        streak: 1,
                        createdAt: new Date().toISOString()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                authUsername.value = "";
                document.getElementById('auth-password').value = "";
            } catch (error) {
                authError.textContent = "AUTH FAILED: " + error.message;
                authError.classList.remove('hidden');
            }
            authBtn.innerHTML = "START <i class='fas fa-play ml-1'></i>";
        };

        window.handleLogout = async function() {
            try {
                // Set status to offline before signing out
                if (currentUser) {
                    await setDoc(doc(db, 'artifacts', CLONBROW_APP_ID, 'public', 'data', 'presence', currentUser.uid), { status: 'Offline' }, { merge: true });
                }
                await signOut(auth);
            } catch (error) {
                console.error("Logout Error", error);
            }
        };

        window.saveBio = async function() {
            if (!currentUser) return;
            const bio = document.getElementById('user-bio').value;
            const profileRef = doc(db, 'artifacts', CLONBROW_APP_ID, 'users', currentUser.uid, 'profile', 'main');
            await setDoc(profileRef, { bio }, { merge: true });
        };

        window.previewPFP = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    pfpImage.src = e.target.result;
                    if (currentUser) {
                        const profileRef = doc(db, 'artifacts', CLONBROW_APP_ID, 'users', currentUser.uid, 'profile', 'main');
                        await setDoc(profileRef, { pfp: e.target.result }, { merge: true });
                        window.updateUserStatus('Updated Profile'); // trigger presence sync with new PFP
                    }
                }
                reader.readAsDataURL(file);
            }
        };

        // Expose functions to global scope
        window.createNewTab = createNewTab;
        window.switchTab = switchTab;
        window.closeTab = closeTab;
        window.goBack = goBack;
        window.goForward = goForward;
        window.reloadPage = reloadPage;
        window.goHome = goHome;
        window.loadWebPage = loadWebPage;

        // System Boot
        createNewTab();

    </script>
</body>
</html>
